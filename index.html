<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cámaras Oficiales</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; }
  #map { height: 100vh; width: 100%; }
  .camera-popup { max-width: 320px; }
  .camera-popup img { max-width: 100%; border-radius: 6px; margin-top: 8px; }
  .status-panel {
    position: absolute; top: 20px; right: 20px;
    background: white; padding: 14px 18px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 1000; font-size: 13px;
  }
  .filter-controls {
    position: absolute; bottom: 30px; left: 20px;
    background: white; padding: 12px 16px; border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15); z-index: 1000; font-size: 13px;
  }
  .filter-controls label { display: flex; gap: 6px; padding: 3px 0; cursor: pointer; }
  #loading {
    position: absolute; inset: 0; background: rgba(255,255,255,0.9);
    display: flex; align-items: center; justify-content: center;
    z-index: 2000; font-size: 18px; color: #666;
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="loading">🔄 Cargando cámaras...</div>
<div class="status-panel"><strong id="total">0</strong> cámaras</div>
<div class="filter-controls" id="filters"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const map = L.map('map').setView([40.4168, -3.7038], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({ maxClusterRadius: 50, chunkedLoading: true });
map.addLayer(cluster);

const colors = { 'DGT': '#003366', 'MeteoGalicia': '#0066cc', 'Madrid Calle 30': '#cc0000' };
let allCameras = [];
const active = new Set(Object.keys(colors));

function icon(color) {
  return L.divIcon({
    html: `<div style="background:${color};width:22px;height:22px;border-radius:50%;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);"></div>`,
    iconSize: [22, 22], iconAnchor: [11, 11], popupAnchor: [0, -11]
  });
}

async function load() {
  try {
    const r = await fetch('camaras_oficiales.json?t=' + Date.now());
    const data = await r.json();
    allCameras = data.cameras || [];
    document.getElementById('total').textContent = allCameras.length;
    buildFilters();
    render();
  } catch (e) {
    document.getElementById('loading').textContent = '❌ Error al cargar datos';
    return;
  }
  document.getElementById('loading').style.display = 'none';
}

function buildFilters() {
  const sources = [...new Set(allCameras.map(c => c.source))];
  const el = document.getElementById('filters');
  el.innerHTML = '<strong style="font-size:11px;color:#666;">FUENTES</strong>';
  sources.forEach(s => {
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox" checked data-src="${s}"> ${s}`;
    label.querySelector('input').addEventListener('change', e => {
      e.target.checked ? active.add(s) : active.delete(s);
      render();
    });
    el.appendChild(label);
  });
}

function render() {
  cluster.clearLayers();
  allCameras.filter(c => active.has(c.source)).forEach(c => {
    const color = colors[c.source] || '#666';
    const popup = `
      <div class="camera-popup">
        <span style="background:${color};color:white;padding:2px 8px;border-radius:12px;font-size:11px;">${c.source}</span>
        <strong style="display:block;margin-top:6px;">${c.name}</strong>
        ${c.image_url ? `<img src="${c.image_url}" onerror="this.style.display='none'">` : '<div style="margin-top:8px;font-size:12px;color:#999;">📷 Sin imagen</div>'}
      </div>`;
    L.marker([c.lat, c.lon], { icon: icon(color) }).bindPopup(popup, { maxWidth: 340 }).addTo(cluster);
  });
}

load();
</script>
</body>
</html>
