name: Actualizar cámaras

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt
      - name: Ejecutar agregador
        run: python backend/agregador.py
      - name: Commit y push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add camaras_oficiales.json
          git diff --staged --quiet || git commit -m "Actualizar cámaras: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
